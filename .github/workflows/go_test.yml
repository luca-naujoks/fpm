name: go_test.yml

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -race -vet=off ./...